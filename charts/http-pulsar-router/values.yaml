replicaCount: 2

image:
  repository: lengdanlexin/http-pulsar-router
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 80
  targetPort: http
  nodePort: null

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: http-pulsar-router.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: false
  ingress: []
  egress: []

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

terminationGracePeriodSeconds: 30

probes:
  startup:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 2
    timeoutSeconds: 1
    failureThreshold: 30
    successThreshold: 1
  liveness:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
    successThreshold: 1
  readiness:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2
    successThreshold: 1

pulsarAuth:
  enabled: false
  create: false
  secretName: pulsar-auth-secret-key
  secretKey: adminToken
  mountPath: /app/secrets/pulsar
  token: ""
  tokenBase64: ""

config:
  server:
    addr: ":8080"
    readTimeout: "5s"
    writeTimeout: "10s"
    shutdownTimeout: "15s"
    requestTimeout: "9s"
    readinessTimeout: "2s"
    pulsarFailureLivenessThreshold: "5m"
    maxBodyBytes: 1048576
    maxBatchItems: 1000
    auth:
      enabled: true
      bearerToken: ""
      bearerTokenFile: ""
    publishRetry:
      maxAttempts: 3
      initialBackoff: "100ms"
      maxBackoff: "2s"
    circuitBreaker:
      enabled: true
      failureThreshold: 20
      openDuration: "10s"
  pulsar:
    url: "pulsar://pulsar-broker.pulsar.svc.cluster.local:6650"
    operationTimeout: "5s"
    connectionTimeout: "5s"
    authTokenFile: ""
  routes:
    mss_tag_push_event_test:
      topic: "persistent://public/default/mss_tag_push_event_test"
      auth:
        bearerToken: ""
        bearerTokenFile: ""
      validation:
        maxBodyBytes: 1048576
        maxBatchItems: 1000
        requiredFields: []
