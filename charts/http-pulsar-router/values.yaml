replicaCount: 2

image:
  repository: lengdanlexin/http-pulsar-router
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 80
  targetPort: http

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

terminationGracePeriodSeconds: 30

pulsarAuth:
  enabled: false
  create: false
  secretName: pulsar-auth-secret-key
  secretKey: adminToken
  mountPath: /app/secrets/pulsar
  token: ""
  tokenBase64: ""

config:
  server:
    auth:
      enabled: false
      bearerToken: ""
      bearerTokenFile: ""
  pulsar:
    url: "pulsar://pulsar-broker.pulsar.svc.cluster.local:6650"
    authTokenFile: ""
  routes:
    mss_tag_push_event_test:
      topic: "persistent://public/default/mss_tag_push_event_test"
      auth:
        bearerToken: ""
        bearerTokenFile: ""
