{{- if and .Values.pulsarAuth.enabled .Values.pulsarAuth.create -}}
{{- $token := default "" .Values.pulsarAuth.token -}}
{{- $tokenBase64 := default "" .Values.pulsarAuth.tokenBase64 -}}
{{- if and (eq $token "") (eq $tokenBase64 "") -}}
{{- fail "pulsarAuth.create=true requires pulsarAuth.token or pulsarAuth.tokenBase64" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.pulsarAuth.secretName }}
  labels:
    {{- include "http-pulsar-router.labels" . | nindent 4 }}
type: Opaque
{{- if ne $token "" }}
stringData:
  {{ .Values.pulsarAuth.secretKey }}: {{ $token | quote }}
{{- else }}
data:
  {{ .Values.pulsarAuth.secretKey }}: {{ $tokenBase64 | quote }}
{{- end }}
{{- end }}
